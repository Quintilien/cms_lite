expose_php          = Off
date.timezone       = Europe/Brussels
; PHP errors: in the container log (docker logs), never on the page
; (without php.ini, the official image displays errors: paths, SQL queries)
display_errors      = Off
log_errors          = On
; attachments: up to 100 MB (short videos, audio);
; images also have their own 25 MB ceiling (admin/lib.php)
upload_max_filesize = 100M
post_max_size       = 110M
max_input_time      = 300
memory_limit        = 256M
