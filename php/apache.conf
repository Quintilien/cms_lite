# CMS Lite 4 — Apache settings shared by both containers

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Editor sources (and README): no business being online. Since 4.4.0,
# config.ini, composer.* and vendor/ are no longer in the web root; the rule
# still covers them, as a precaution.
RedirectMatch 404 "^/(config\.ini|composer\.(json|lock)|vendor/|editor-src/|README(\.fr)?\.md$)"

# Inter font: readable from the editor, which is on another host
<LocationMatch "^/css/fonts/">
    Header set Access-Control-Allow-Origin "*"
</LocationMatch>
